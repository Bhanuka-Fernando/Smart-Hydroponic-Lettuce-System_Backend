services:
  postgres:
    image: postgres:16-alpine
    container_name: hydroponic-postgres
    environment:
      POSTGRES_USER: hydroponic_user
      POSTGRES_PASSWORD: hydroponic2026
      POSTGRES_DB: hydroponic_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydroponic_user -d hydroponic_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentication:
    build:
      context: ./Authentication
    container_name: hydroponic-authentication
    environment:
      DATABASE_URL: postgresql://hydroponic_user:hydroponic2026@postgres:5432/hydroponic_auth
      SECRET_KEY: change-this-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      GOOGLE_CLIENT_ID: change-me.apps.googleusercontent.com
    ports:
      - "8000:8000"
    volumes:
      - auth_static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  disease-service:
    build:
      context: ./disease-service
    container_name: hydroponic-disease-service
    environment:
      DATABASE_URL: postgresql://hydroponic_user:hydroponic2026@postgres:5432/hydroponic_iot
      TIPBURN_PATH: artifacts/tipburn_best.pt
      CLASSIFIER_PATH: artifacts/cls_effnetv2_b1_best.pt
    ports:
      - "8001:8000"
    volumes:
      - disease_uploads:/app/uploads
      - disease_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  spoilage-ml-service:
    build:
      context: ./spoilage-ml-service
    container_name: hydroponic-spoilage-ml-service
    environment:
      DATABASE_URL: postgresql://hydroponic_user:hydroponic2026@postgres:5432/hydroponic_iot
      JWT_SECRET: change-this-secret-key
      JWT_ALGORITHM: HS256
      AUTH_ENABLED: "false"
    ports:
      - "8002:8000"
    volumes:
      - spoilage_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  water-quality-ml-service:
    build:
      context: ./water-quality-ml-service
    container_name: hydroponic-water-quality-ml-service
    environment:
      DATABASE_URL: postgresql+psycopg2://hydroponic_user:hydroponic2026@postgres:5432/hydroponic_iot
      PORT: 8000
      CORS_ORIGINS: "*"
      SERVICE_NAME: water-quality-ml-service
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  weight-estimation-growth-forecasting:
    build:
      context: ./weight_estimation_growth_forecasting
    container_name: hydroponic-weight-growth-service
    environment:
      DATABASE_URL: postgresql://hydroponic_user:hydroponic2026@postgres:5432/hydroponic_iot
      SECRET_KEY: change-this-secret-key
      ALGORITHM: HS256
      FX: 615.0
      FY: 615.0
      DEPTH_SCALE: 0.001
      SEG_THRESHOLD: 0.5
      USE_IMAGENET_NORM: "false"
    ports:
      - "8004:8000"
    volumes:
      - growth_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      virtual-device-service:
        condition: service_started
    restart: unless-stopped

  virtual-device-service:
    build:
      context: ./weight_estimation_growth_forecasting
    container_name: hydroponic-virtual-device-service
    command: ["uvicorn", "virtual_device_service.main:app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "8010:8010"
    restart: unless-stopped

volumes:
  postgres_data:
  auth_static:
  disease_uploads:
  disease_data:
  spoilage_uploads:
  growth_uploads:
